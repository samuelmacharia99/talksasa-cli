name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # publish the release
  id-token: write      # sign the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TALKSASA_NO_KEYRING: "1"
      # Anyone can check a download came from this workflow:
      #   gh attestation verify talksasa_*.tar.gz --repo samuelmacharia99/talksasa-cli
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip, dist/checksums.txt"
