# Release builds: `git tag v0.1.0 && git push --tags` runs .github/workflows/release.yml.
version: 2

project_name: talksasa

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: talksasa
    main: .
    binary: talksasa
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: talksasa
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "talksasa_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: samuelmacharia99
    name: talksasa-cli
  draft: false
  prerelease: auto
